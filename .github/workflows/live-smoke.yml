# End-to-end smoke test against the DEPLOYED site.
#
# Run it by hand (Actions -> Live smoke test -> Run workflow) after a deploy,
# or whenever the app looks wrong in a browser and you want to know whether
# the cause is the site, the backend, or the CORS allowlist between them.
#
# Deliberately not on every push: it wakes the free-tier backend and takes a
# couple of minutes.
name: Live smoke test

on:
  workflow_dispatch:
    inputs:
      site:
        description: Deployed site URL
        default: https://ctin187.github.io/datasciencecoursera/
        required: true
      backend:
        description: Backend base URL
        default: https://fantasy-dynasty-backend.onrender.com
        required: true
      league_id:
        description: Optional Sleeper league ID; loads a real league end to end
        default: ''
        required: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A backend that accepts the connection then stalls should fail this run
    # quickly, not sit on a runner. The in-page fetches carry their own
    # deadlines too; this is the backstop.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm init -y && npm i -D playwright && npx playwright install --with-deps chromium

      - name: Run smoke test
        env:
          SITE: ${{ inputs.site }}
          BACKEND: ${{ inputs.backend }}
          LEAGUE_ID: ${{ inputs.league_id }}
          OUT_DIR: ${{ runner.temp }}
        run: node frontend/scripts/live-smoke.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site
          path: ${{ runner.temp }}/live-site.png
          if-no-files-found: warn
