name: Deploy Fantasy Dynasty Dashboard

on:
  push:
    branches: [master]
    paths:
      - 'fantasy-dynasty-dashboard/**'
      - '.github/workflows/deploy-fantasy-dynasty-dashboard.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fantasy-dynasty-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: fantasy-dynasty-dashboard
        run: npm ci

      - name: Build
        working-directory: fantasy-dynasty-dashboard
        env:
          GITHUB_PAGES: 'true'
          # Base URL of the deployed Python VOR backend (see /fantasy-backend).
          # Set this as a repository *variable* named VITE_API_BASE_URL
          # (Settings -> Secrets and variables -> Actions -> Variables). It is a
          # public URL baked into client-side JS, so it is not a secret and does
          # not belong in Secrets.
          #
          # If unset, the build still succeeds and the roster view reports that
          # the backend is unconfigured rather than showing numbers it cannot
          # compute.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Report backend wiring
        working-directory: fantasy-dynasty-dashboard
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::warning::VITE_API_BASE_URL is not set - the deployed site will show 'backend not configured' on the roster view. Set it as a repository variable once the backend is deployed."
          else
            echo "Built against backend: ${{ vars.VITE_API_BASE_URL }}"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fantasy-dynasty-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
