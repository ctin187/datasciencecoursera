name: Deploy Fantasy Decision Dashboard

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          # Base URL of the deployed Python VOR backend (see /backend).
          #
          # Defaults to the project's own Render service. This is deliberately a
          # committed default rather than a required setup step: the value is a
          # public URL that gets baked into client-side JS on every build, so it
          # is not a secret and hiding it buys nothing.
          #
          # To point the site at a different backend, set a repository
          # *variable* named VITE_API_BASE_URL (Settings -> Secrets and
          # variables -> Actions -> Variables). It overrides the default below.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://fantasy-dynasty-backend.onrender.com' }}
        run: npm run build

      - name: Report backend wiring
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "Built against the default backend: https://fantasy-dynasty-backend.onrender.com"
            echo "::notice::Using the committed default backend URL. Set a VITE_API_BASE_URL repository variable to override it."
          else
            echo "Built against backend from repo variable: ${{ vars.VITE_API_BASE_URL }}"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
