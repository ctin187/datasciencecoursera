name: Deploy Fantasy Decision Dashboard

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          # Base URL of the deployed Python VOR backend (see /backend).
          #
          # Defaults to the project's own Render service. This is deliberately a
          # committed default rather than a required setup step: the value is a
          # public URL that gets baked into client-side JS on every build, so it
          # is not a secret and hiding it buys nothing.
          #
          # To point the site at a different backend, set a repository
          # *variable* named VITE_API_BASE_URL (Settings -> Secrets and
          # variables -> Actions -> Variables). It overrides the default below.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://fantasy-dynasty-backend.onrender.com' }}
        run: npm run build

      # Does the backend this build just baked in actually exist? Answering that
      # at deploy time beats finding out from a "could not reach the backend"
      # toast in the browser. Never fails the deploy: the frontend degrades to
      # Sleeper-rank ordering without a backend, so a dead API is a warning,
      # not a broken site.
      - name: Probe the backend
        env:
          BACKEND: ${{ vars.VITE_API_BASE_URL || 'https://fantasy-dynasty-backend.onrender.com' }}
          FROM_VAR: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -n "$FROM_VAR" ]; then
            echo "Backend URL came from the VITE_API_BASE_URL repo variable."
          else
            echo "Backend URL is the committed default (no VITE_API_BASE_URL repo variable set)."
          fi
          echo "Probing $BACKEND/health ..."

          # Render free tiers cold-start, so allow a slow first response and
          # retry before concluding the service is not there.
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                     --max-time 90 "$BACKEND/health" || echo 000)
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: HTTP $code"
            sleep 10
          done

          if [ "$code" = "200" ]; then
            echo "::notice::Backend is live at $BACKEND"
            cat /tmp/health.json
          elif [ "$code" = "000" ]; then
            echo "::warning::No backend answered at $BACKEND (DNS/connection failed - the service likely does not exist). The site still works: VOR columns fall back to Sleeper relevance rank. Deploy /backend via the root render.yaml Blueprint, then set the VITE_API_BASE_URL repo variable to its URL."
          else
            echo "::warning::Backend at $BACKEND answered HTTP $code, not 200. The site still works: VOR columns fall back to Sleeper relevance rank."
            cat /tmp/health.json || true
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
